identity:
  author: yevanchen
  name: mem0ai
  label:
    en_US: mem0
    zh_Hans: mem0
    pt_BR: mem0
  description:
    en_US: mem0
    zh_Hans: mem0
    pt_BR: mem0
  icon: mem0.png

credentials_for_provider:
  mem0_api_key:
    type: secret-input
    required: true
    label:
      en_US: Mem0 API key
      zh_Hans: Mem0 API Key
      pt_BR: Mem0 API key
    placeholder:
      en_US: Please input your Mem0 API key
      zh_Hans: 请输入你的 Mem0 API Key
      pt_BR: Please input your Mem0 API key
    help:
      en_US: Please visit the Mem0 AI Dashboard to register an account and apply for an API key
      zh_Hans: 请访问 Mem0 AI 仪表板注册账号并获取 API Key
      pt_BR: Please visit the Mem0 AI Dashboard to register an account and apply for an API key
    url: https://app.mem0.ai/dashboard/api-keys
  mem0_base_url:
    type: text-input
    required: false
    default: https://api.mem0.ai/v1
    label:
      en_US: Mem0 Base URL
      zh_Hans: Mem0 基础 URL
      pt_BR: Mem0 Base URL
    placeholder:
      en_US: 'Please input your Mem0 Base URL (default: https://api.mem0.ai/v1)'
      zh_Hans: '请输入你的 Mem0 基础 URL (默认: https://api.mem0.ai/v1)'
      pt_BR: 'Please input your Mem0 Base URL (padrão: https://api.mem0.ai/v1)'
    help:
      en_US: This field is used to set the Base URL for the Mem0 server. The default is https://api.mem0.ai/v1.
      zh_Hans: 此字段用于设置 Mem0 服务器的基础 URL，默认值为 https://api.mem0.ai/v1.
      pt_BR: Este campo define a URL base do servidor Mem0. O padrão é https://api.mem0.ai/v1.
    url: https://app.mem0.ai/dashboard/api-keys

tools:
  - tools/add_memory.yaml
  - tools/retrieve_memory.yaml
extra:
  python:
    source: provider/mem0.py
